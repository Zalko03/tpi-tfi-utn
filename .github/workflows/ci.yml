name: CI/CD Pipeline - Cafetería Gestión

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  escaneo-secretos:
    name: Escaneo de Secretos y Credenciales
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que ningún archivo .env esté commiteado
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: Se detectó un archivo .env en el índice de Git."
            exit 1
          fi
          echo "Verificación de archivos .env completada con éxito."

      - name: Escaneo de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-python:
    name: Linter Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Ruff
        run: pip install ruff==0.6.9

      - name: Ejecutar verificación de linter (Ruff check)
        run: ruff check backend-django/ ai-service/

      - name: Ejecutar verificación de formato (Ruff format)
        run: ruff format --check backend-django/ ai-service/

  lint-node:
    name: Linter Node (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend-node/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

  test-django:
    name: Tests Django (357+ pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    env:
      DJANGO_SECRET_KEY: test-secret-key-solo-para-ci-cafe-gestion-50-chars
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      USE_SQLITE: "True"
      DJANGO_LOG_LEVEL: WARNING
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend-django/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar migraciones en base de datos SQLite de prueba
        run: python manage.py migrate --noinput

      - name: Ejecutar suite de pruebas Pytest
        run: pytest

  test-node:
    name: Tests Express + MongoDB (119+ pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      NODE_PORT: 3000
      MONGO_URI: mongodb://localhost:27017/cafe_gestion_test
      DJANGO_BASE_URL: http://127.0.0.1:8000/api
      AI_SERVICE_URL: http://127.0.0.1:8001
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend-node/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite de pruebas Jest
        run: npm test

  test-ai-service:
    name: Tests FastAPI AI Service (57+ pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      AI_SERVICE_PORT: 8001
      AI_PROVIDER: gemini
      AI_PROMPT_VERSION: v1
      AI_TIMEOUT_SECONDS: 10.0
      AI_MAX_RETRIES: 2
      GEMINI_API_KEY: fake-key-para-tests-aislados
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas Pytest
        run: pytest

  build-docker:
    name: Validación de Docker Compose e Imágenes
    runs-on: ubuntu-latest
    needs: [test-django, test-node, test-ai-service]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Crear archivo .env ficticio a partir de .env.example para validación
        run: cp .env.example .env

      - name: Validar sintaxis de docker-compose.yml
        run: docker compose config

      - name: Compilar imágenes Docker multi-stage
        run: docker compose build
