# docker-compose.prod.yml - Configuración de endurecimiento para producción en la PC del local
services:
  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend-django:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-service:
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-25.0}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend-node:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
